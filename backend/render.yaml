services:
  - type: web
    name: kinetiq-api
    runtime: python
    rootDir: backend
    plan: free
    # free plan has no preDeploy hook — migrate during build
    buildCommand: pip install -r requirements.txt && python -m alembic upgrade head
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: KINETIQ_DATABASE_URL
        sync: false
      - key: KINETIQ_AUTH0_DOMAIN
        sync: false
      - key: KINETIQ_CORS_ORIGINS
        sync: false
